<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>✍️ Présent des verbes du 1er groupe — Révision Quest</title><link rel="stylesheet" href="../style.css"></head><body><main>
<section class="top"><h1>✍️ Présent des verbes du 1er groupe</h1><p>Trouver le radical, remplacer le sujet par un pronom et choisir la bonne terminaison.</p></section>
<section id="menu" class="card"><div class="breadcrumb"><a href="../index.html">Accueil</a> › <a href="index.html">Conjugaison</a></div>
<div class="grid">
<button class="tile" onclick="start(0)"><b>⭐ Niveau 1 · Je connais</b>Retrouver les connaissances de la leçon.</button>
<button class="tile" onclick="start(1)"><b>⭐⭐ Niveau 2 · J’applique</b>Utiliser la règle dans des exemples nouveaux.</button>
<button class="tile" onclick="start(2)"><b>⭐⭐⭐ Niveau 3 · Je raisonne</b>Choisir, analyser et éviter les pièges.</button>
</div><div class="tip"><b>🎯 Progression :</b> mémoriser → appliquer → raisonner. Les questions sont différentes à chaque niveau.</div></section>
<section id="game" class="card hidden"><div class="stats"><span id="ln"></span><span id="count"></span></div><div class="progress"><div id="bar" class="bar"></div></div>
<p id="inst" class="instruction"></p><div id="question" class="question"></div><div id="opts" class="options"></div><div id="fb" class="feedback hidden"></div>
<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="secondary" onclick="home()">← Niveaux</button><button id="nextBtn" class="primary hidden" onclick="nextQ()">Suivante →</button></div></section>
<section id="result" class="card hidden"><h2 style="text-align:center">Résultat</h2><div id="bigscore" class="bigscore"></div><div id="stars" class="stars"></div><p id="resultText" style="text-align:center"></p>
<div style="text-align:center"><button class="primary" onclick="start(level)">Rejouer</button> <button class="secondary" onclick="home()">Niveaux</button></div></section>
<footer><a href="index.html">← Retour à Conjugaison</a></footer></main><script src="../app.js"></script><script>
const L=[[{"q": "Pour conjuguer un verbe, il faut d’abord trouver…", "a": "son groupe et son radical", "o": ["son groupe et son radical", "son synonyme et son contraire", "son genre et son nombre", "sa définition et son exemple"], "e": "La fiche commence par repérer le groupe du verbe et son radical."}, {"q": "Dans le verbe « trouver », quel est le radical ?", "a": "trouv-", "o": ["trou-", "trouv-", "trouve-", "trouver-"], "e": "On enlève la terminaison -er : trouv-er → trouv-."}, {"q": "« Trouver » appartient à quel groupe ?", "a": "1er groupe", "o": ["1er groupe", "2e groupe", "3e groupe", "aucun groupe"], "e": "Les verbes réguliers en -er comme « trouver » appartiennent au 1er groupe."}, {"q": "Au présent, « je trouve » se termine par…", "a": "-e", "o": ["-e", "-es", "-ons", "-ent"], "e": "Avec « je », un verbe du 1er groupe prend -e."}, {"q": "Au présent, « tu trouves » se termine par…", "a": "-es", "o": ["-e", "-es", "-ez", "-ent"], "e": "Avec « tu », la terminaison est -es."}, {"q": "Au présent, « il trouve » se termine par…", "a": "-e", "o": ["-e", "-es", "-ons", "-ent"], "e": "Avec il/elle/on, la terminaison est -e."}, {"q": "Au présent, « nous trouvons » se termine par…", "a": "-ons", "o": ["-ons", "-ez", "-ent", "-es"], "e": "Avec « nous », la terminaison est -ons."}, {"q": "Au présent, « vous trouvez » se termine par…", "a": "-ez", "o": ["-ons", "-ez", "-ent", "-e"], "e": "Avec « vous », la terminaison est -ez."}, {"q": "Au présent, « ils trouvent » se termine par…", "a": "-ent", "o": ["-ons", "-ez", "-ent", "-es"], "e": "Avec ils/elles, la terminaison est -ent."}, {"q": "Dans « Alex et les filles », quel pronom peut remplacer le sujet ?", "a": "ils", "o": ["je", "nous", "ils", "elles"], "e": "Le groupe contient Alex et les filles : on le remplace par « ils »."}], [{"q": "Complète : « Je ___ mon cahier. » (chercher)", "a": "cherche", "o": ["cherche", "cherches", "cherchons", "cherchent"], "e": "Avec « je », on écrit cherch-e."}, {"q": "Complète : « Tu ___ la réponse. » (trouver)", "a": "trouves", "o": ["trouve", "trouves", "trouvez", "trouvent"], "e": "Avec « tu », on écrit trouv-es."}, {"q": "Complète : « Léa ___ sa leçon. » (réviser)", "a": "révise", "o": ["révise", "révises", "révisez", "révisent"], "e": "Léa = elle : terminaison -e."}, {"q": "Complète : « Nous ___ en classe. » (travailler)", "a": "travaillons", "o": ["travaille", "travailles", "travaillons", "travaillez"], "e": "Avec « nous », terminaison -ons."}, {"q": "Complète : « Vous ___ le texte. » (recopier)", "a": "recopiez", "o": ["recopie", "recopions", "recopiez", "recopient"], "e": "Avec « vous », terminaison -ez."}, {"q": "Complète : « Les élèves ___ la consigne. » (écouter)", "a": "écoutent", "o": ["écoute", "écoutes", "écoutez", "écoutent"], "e": "Les élèves = ils : terminaison -ent."}, {"q": "Quel pronom remplace « Paul et Hugo » ?", "a": "ils", "o": ["il", "ils", "elles", "nous"], "e": "Deux garçons → ils."}, {"q": "Quel pronom remplace « Emma et Zoé » ?", "a": "elles", "o": ["elle", "ils", "elles", "vous"], "e": "Deux filles → elles."}, {"q": "Quel est le radical de « chanter » ?", "a": "chant-", "o": ["cha-", "chant-", "chante-", "chanter-"], "e": "On retire -er : chant-er."}, {"q": "Quel est le radical de « regarder » ?", "a": "regard-", "o": ["rega-", "regard-", "regarde-", "regarder-"], "e": "On retire -er : regard-er."}], [{"q": "Quelle phrase est correctement conjuguée ?", "a": "Alex et les filles trouvent la solution.", "o": ["Alex et les filles trouve la solution.", "Alex et les filles trouves la solution.", "Alex et les filles trouvez la solution.", "Alex et les filles trouvent la solution."], "e": "« Alex et les filles » = ils → trouv-ent."}, {"q": "Quelle phrase est correctement conjuguée ?", "a": "Ma sœur et moi regardons le film.", "o": ["Ma sœur et moi regarde le film.", "Ma sœur et moi regardons le film.", "Ma sœur et moi regardez le film.", "Ma sœur et moi regardent le film."], "e": "« Ma sœur et moi » = nous → -ons."}, {"q": "Quelle phrase est correctement conjuguée ?", "a": "Toi et Léo cherchez la réponse.", "o": ["Toi et Léo cherche la réponse.", "Toi et Léo cherches la réponse.", "Toi et Léo cherchez la réponse.", "Toi et Léo cherchent la réponse."], "e": "« Toi et Léo » = vous → -ez."}, {"q": "Quel raisonnement est correct pour « les enfants jouent » ?", "a": "les enfants → ils → terminaison -ent", "o": ["les enfants → il → -e", "les enfants → ils → terminaison -ent", "les enfants → vous → -ez", "les enfants → nous → -ons"], "e": "On remplace le groupe sujet par « ils », puis on choisit -ent."}, {"q": "Quel raisonnement est correct pour « mon frère et moi chantons » ?", "a": "mon frère et moi → nous → terminaison -ons", "o": ["mon frère et moi → ils → -ent", "mon frère et moi → vous → -ez", "mon frère et moi → nous → terminaison -ons", "mon frère et moi → je → -e"], "e": "« … et moi » correspond à « nous »."}, {"q": "Dans « elles parlent », pourquoi n’entend-on pas la terminaison -ent ?", "a": "Parce que -ent est muet à la 3e personne du pluriel", "o": ["Parce que -ent est muet à la 3e personne du pluriel", "Parce que le verbe est à l’infinitif", "Parce que « elles » est singulier", "Parce que -ent appartient au radical"], "e": "Au présent des verbes du 1er groupe, -ent ne se prononce pas."}, {"q": "Quel mot contient exactement le radical de « trouver » suivi de la terminaison de « nous » ?", "a": "trouvons", "o": ["trouve", "trouves", "trouvons", "trouvent"], "e": "trouv- + -ons = trouvons."}, {"q": "Quel mot contient exactement le radical de « chercher » suivi de la terminaison de « vous » ?", "a": "cherchez", "o": ["cherche", "cherchons", "cherchez", "cherchent"], "e": "cherch- + -ez = cherchez."}, {"q": "Le sujet est « la maîtresse ». Quelle terminaison choisir pour « expliquer » au présent ?", "a": "-e", "o": ["-e", "-es", "-ez", "-ent"], "e": "« La maîtresse » = elle → expliqu-e."}, {"q": "Le sujet est « mes parents ». Quelle terminaison choisir pour « regarder » au présent ?", "a": "-ent", "o": ["-e", "-ons", "-ez", "-ent"], "e": "« Mes parents » = ils → regard-ent."}]];const names=["Niveau 1 · Je connais","Niveau 2 · J’applique","Niveau 3 · Je raisonne"];
const instructions=["Retrouve précisément la leçon.","Applique la règle à un nouvel exemple.","Observe bien : les mauvaises réponses sont plausibles."];
let level=0,n=0,score=0,order=[],cur=null,answered=false;const E=id=>document.getElementById(id);
function start(l){level=l;n=0;score=0;order=shuffle([...Array(L[l].length).keys()]);E("menu").classList.add("hidden");E("result").classList.add("hidden");E("game").classList.remove("hidden");E("ln").textContent=names[l];E("inst").textContent=instructions[l];nextQ()}
function home(){E("game").classList.add("hidden");E("result").classList.add("hidden");E("menu").classList.remove("hidden")}
function nextQ(){if(n>=order.length)return finish();answered=false;cur=L[level][order[n++]];E("count").textContent=n+"/"+order.length;E("bar").style.width=((n-1)/order.length*100)+"%";E("question").textContent=cur.q;E("fb").className="feedback hidden";E("nextBtn").classList.add("hidden");E("opts").innerHTML="";shuffle(cur.o).forEach(x=>{let b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>check(x);E("opts").appendChild(b)})}
function check(x){if(answered)return;answered=true;let ok=x===cur.a,f=E("fb");f.classList.remove("hidden");if(ok){score++;f.classList.add("good");f.innerHTML="✅ <b>Bravo !</b><br>"+cur.e}else{f.classList.add("bad");f.innerHTML="❌ <b>Pas tout à fait.</b><br>La bonne réponse est <b>"+cur.a+"</b>.<br>"+cur.e}E("bar").style.width=(n/order.length*100)+"%";E("nextBtn").classList.remove("hidden")}
function finish(){E("game").classList.add("hidden");E("result").classList.remove("hidden");renderResult(score,order.length);saveBest("ortho-present-"+level,score)}
</script></body></html>
