 ["rechercher La Charité-sur-Loire → zoomer → repérer les rues et l’école", "zoomer au hasard → supprimer les noms → chercher la France", "changer de carte → dézoomer au maximum → fermer la recherche", "chercher le Cher → masquer les rues → supprimer les bâtiments"], "e": "On localise d’abord la ville, puis on augmente progressivement le niveau de détail."}, {"q": "Pour décrire précisément la position d’un hameau, quelle formulation est la meilleure ?", "a": "« Il est au Nord-Est de La Charité-sur-Loire. »", "o": ["« Il est quelque part à côté. »", "« Il est au Nord-Est de La Charité-sur-Loire. »", "« Il est sur la carte. »", "« Il est près d’une couleur. »"], "e": "Une localisation précise utilise un repère et une direction."}, {"q": "Pourquoi le nom exact d’une forêt est-il plus utile que « une forêt à l’Est » ?", "a": "il permet d’identifier précisément le lieu", "o": ["il permet d’identifier précisément le lieu", "il change l’orientation de la carte", "il indique automatiquement la distance", "il remplace la légende"], "e": "Un toponyme identifie précisément un lieu."}, {"q": "Une carte routière et une carte géologique montrent le même territoire. Pourquoi leur aspect diffère-t-il ?", "a": "elles n’ont pas le même objectif ni les mêmes informations", "o": ["elles n’ont pas le même objectif ni les mêmes informations", "l’une est forcément fausse", "le Nord n’est jamais le même", "les communes changent de place"], "e": "Une carte sélectionne les informations utiles à son objectif."}, {"q": "Pour préparer un trajet, pourquoi une carte routière est-elle plus utile qu’une carte géologique ?", "a": "elle met en valeur les voies de circulation", "o": ["elle met en valeur les voies de circulation", "elle montre davantage les types de roches", "elle supprime toutes les routes", "elle ne comporte aucun nom"], "e": "Le contenu d’une carte doit être adapté à l’usage recherché."}, {"q": "Un élève dit : « La forêt est à droite, donc elle est toujours à l’Est. » Que manque-t-i let level=0,n=0,score=0,order=[],cur=null,answered=false;const E=id=>document.getElementById(id);
