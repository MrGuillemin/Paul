’autorité du roi", "o": ["C’est une prison royale qui symbolise l’autorité du roi", "C’est le lieu où vivent les paysans", "C’est le siège du clergé", "C’est le principal marché"], "e": "La Bastille représente l’autorité royale."}, {"q": "Que montre la prise de la Bastille selon la leçon ?", "a": "Le peuple refuse la monarchie absolue et réclame davantage de liberté", "o": ["Le peuple refuse la monarchie absolue et réclame davantage de liberté", "Le peuple veut renforcer les privilèges", "Le tiers état veut augmenter les impôts", "Le peuple veut renforcer la noblesse"], "e": "La fiche relie la prise de la Bastille au refus de la monarchie absolue et à la demande de liberté."}, {"q": "Quel contraste résume le mieux la société ?", "a": "Environ 3 % appartiennent aux ordres privilégiés contre 97 % au tiers état", "o": ["Environ 3 % appartiennent aux ordres privilégiés contre 97 % au tiers état", "97 % appartiennent à la noblesse", "Chaque ordre représente un tiers", "Le clergé représente la moitié"], "e": "1 % + 2 % = environ 3 % pour clergé et noblesse, face aux 97 % du tiers état."}, {"q": "Quel lien existe entre la crise et le mécontentement populaire ?", "a": "La crise aggrave les difficultés du tiers état déjà soumis aux impôts", "o": ["La crise aggrave les difficultés du tiers état déjà soumis aux impôts", "La crise donne des privilèges au tiers état", "La crise supprime immédiatement les ordres", "La crise enrichit les paysans"], "e": "Endettement, famine et pression fiscale renforcent le mécontentement."}, {"q": "Quelle opposition est au cœur du chapitre ?", "a": "Les privilèges d’une minorité face aux difficultés de la majorité", "o": ["Les privilèges d’une minorité face aux difficultés de la majorité", "Paysans contre artisans", "Clergé contre roi uniquement", "Commerçants contre paysans uniquement"], "e": "Le chapitre insiste sur l’inégalité entre minorité privilégiée et majorité."}], [{"q": "Un personnage est artisan, travaille et paie de nombreux impôts. À quel ordre appartient-il ?", "a": "Au tiers état", "o": ["Au tiers état", "À la noblesse", "Au clergé", "À la cour"], "e": "Les artisans appartiennent au tiers état."}, {"q": "Un personnage est seigneur, propriétaire de terres et privilégié. À quel ordre appartient-il ?", "a": "À la noblesse", "o": ["À la noblesse", "Au tiers état", "Au clergé", "Aux commerçants"], "e": "Les seigneurs appartiennent à la noblesse."}, {"q": "Sur 100 Français, environ combien appartiennent au clergé et à la noblesse réunis ?", "a": "3", "o": ["3", "1", "50", "97"], "e": "1 % de clergé + 2 % de noblesse = environ 3 %."}, {"q": "Quelle chaîne respecte le mieux la logique du cours ?", "a": "Inégalités et crise → mécontentement → révolte → prise de la Bastille", "o": ["Inégalités et crise → mécontentement → révolte → prise de la Bastille", "Bastille → privilèges → crise → doléances", "Révolution → monarchie absolue → famine", "Doléances → disparition de la crise → Bastille"], "e": "Le cours part des inégalités et de la crise, puis montre le mécontentement et la révolte."}, {"q": "Quelle affirmation est incompatible avec la leçon ?", "a": "La majorité de la population bénéficie de privilèges", "o": ["La majorité de la population bénéficie de privilèges", "Le tiers état représente environ 97 %", "Le royaume est endetté", "La noblesse défend ses privilèges"], "e": "C’est une minorité qui bénéficie de privilèges."}, {"q": "Si Louis XVI veut connaître les demandes du peuple, quel document doit-il consulter ?", "a": "Les cahiers de doléances", "o": ["Les cahiers de doléances", "Un registre des privilèges", "Un traité militaire", "Un livre de comptes de la Bastille"], "e": "Les cahiers de doléances rassemblent plaintes et propositions."}, {"q": "Pourquoi le chiffre de 97 % aide-t-il à comprendre l’importance du mécontentement ?", "a": "Parce que les difficultés touchent l’immense majorité de la population", "o": ["Parce que les difficultés touchent l’immense majorité de la population", "Parce que 97 % sont nobles", "Parce que seuls 3 % paient des taxes", "Parce que 97 % sont prêtres"], "e": "Le tiers état représente presque toute la population."}, {"q": "Pourquoi la prise d’une prison devient-elle un événement politique majeur ?", "a": "La Bastille représente l’autorité royale que les révoltés contestent", "o": ["La Bastille représente l’autorité royale que les révoltés contestent", "Tous les paysans y vivent", "Elle collecte la dîme", "Elle appartient au tiers état"], "e": "La portée de la Bastille est notamment symbolique : elle incarne l’autorité du roi."}, {"q": "Quel résumé respecte le mieux la logique générale du chapitre ?", "a": "Une société inégalitaire et une grave crise alimentent une contestation qui débouche sur la Révolution", "o": ["Une société inégalitaire et une grave crise alimentent une contestation qui débouche sur la Révolution", "Une société égalitaire devient une monarchie absolue", "Le tiers état défend ses privilèges", "La richesse du royaume provoque la Bastille"], "e": "Inégalités + crise + mécontentement conduisent à la rupture révolutionnaire."}, {"q": "Quel événement constitue l’aboutissement de la progression étudiée dans cette fiche ?", "a": "La prise de la Bastille, qui marque le début de la Révolution française", "o": ["La prise de la Bastille, qui marque le début de la Révolution française", "La création des trois ordres", "L’arrivée de Louis XIV", "La création de la gabelle"], "e": "La fiche se termine sur le 14 juillet 1789 et le début de la Révolution."}]];const names=["Niveau 1 · Je connais","Niveau 2 · Je comprends","Niveau 3 · Je raisonne"];const ins=["Retrouve précisément les connaissances du cours.","Choisis l’explication qui montre que tu as compris.","Utilise plusieurs informations du cours pour raisonner."];let level=0,n=0,score=0,order=[],cur=null,answered=false;const E=id=>document.getElementById(id);

function home(){E("game").classList.add("hidden");E("result").classList.add("hidden");E("menu").classList.remove("hidden")}
function nextQ(){if(n>=10)return finish();answered=false;cur=L[level][order[n++]];E("count").textContent=n+"/10";E("bar").style.width=((n-1)*10)+"%";E("question").textContent=cur.q;E("fb").className="feedback hidden";E("nextBtn").classList.add("hidden");E("opts").innerHTML="";shuffle(cur.o).forEach(x=>{let b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>check(x);E("opts").appendChild(b)})}
