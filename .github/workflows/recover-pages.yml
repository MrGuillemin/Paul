name: Recuperer la publication Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-pages.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-pages
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Annuler uniquement la relance Pages restee bloquee
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = 42250720719;
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id
            });
            if (run.name !== 'pages build and deployment') {
              throw new Error('Execution inattendue : aucune annulation effectuee.');
            }
            if (!['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)) {
              core.info('La relance est deja terminee : aucune action necessaire.');
              return;
            }
            core.info('Annulation de la relance Pages bloquee #' + run_id);
            try {
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id });
            } catch (error) {
              if (error.status !== 409) throw error;
              core.warning('Annulation normale refusee (409). Essai de l’annulation forcee officielle.');
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                owner, repo, run_id
              });
            }
            for (let i = 0; i < 12; i++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data: latest } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id
              });
              if (latest.status === 'completed') {
                core.info('Ancienne execution terminee : ' + latest.conclusion);
                return;
              }
            }
            core.warning('Annulation demandee, mais pas encore confirmee par GitHub.');
