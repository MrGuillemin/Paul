function check(x){if(answered)return;answered=true;let ok=x===cur.a,f=E("fb");f.classList.remove("hidden");if(ok){score++;f.classList.add("good");f.innerHTML="✅ <b>Bravo !</b><br>"+cur.e}else{f.classList.add("bad");f.innerHTML="❌ <b>Pas tout à fait.</b><br>Bonne réponse : <b>"+cur.a+"</b><br>"+cur.e}E("bar").style.width=(n*10)+"%";E("nextBtn").classList.remove("hidden")}
function finish(){E("game").classList.add("hidden");E("result").classList.remove("hidden");renderResult(score,10);saveBest("tables-"+ex,score)}</script></body></html>
