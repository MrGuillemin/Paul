function start(l){level=l;n=0;score=0;order=shuffle([...Array(L[l].length).keys()]).slice(0,10);E("menu").classList.add("hidden");E("result").classList.add("hidden");E("game").classList.remove("hidden");E("ln").textContent=names[l];E("inst").textContent=inst[l];nextQ()}
function home(){E("game").classList.add("hidden");E("result").classList.add("hidden");E("menu").classList.remove("hidden")}
function nextQ(){if(n>=10)return finish();answered=false;cur=L[level][order[n++]];E("count").textContent=n+"/10";E("bar").style.width=((n-1)*10)+"%";E("question").textContent=cur.q;E("fb").className="feedback hidden";E("nextBtn").classList.add("hidden");E("opts").innerHTML="";shuffle(cur.o).forEach(x=>{let b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>check(x);E("opts").appendChild(b)})}
function check(x){if(answered)return;answered=true;let ok=x===cur.a,f=E("fb");f.classList.remove("hidden");if(ok){score++;f.classList.add("good");f.innerHTML="✅ <b>Bravo !</b><br>"+cur.e}else{f.classList.add("bad");f.innerHTML="❌ <b>Pas tout à fait.</b><br>La bonne réponse est <b>"+cur.a+"</b>.<br>"+cur.e}E("bar").style.width=(n*10)+"%";E("nextBtn").classList.remove("hidden")}
function finish(){E("game").classList.add("hidden");E("result").classList.remove("hidden");renderResult(score,10);saveBest("sciences-systeme-solaire-"+level,score)}
</script></body></html>
